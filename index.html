<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>GALIB | Social Hub</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#111;--line:#282828;--muted:#a5a5a5;--white:#f7f7f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#171717 0%,#080808 42%,#030303 100%);color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:34px 16px}
main{width:100%;max-width:430px;text-align:center}
.logo-wrap{width:124px;height:124px;margin:10px auto 18px;border:1px solid #333;border-radius:50%;overflow:hidden;background:#000;display:grid;place-items:center;box-shadow:0 0 35px #ffffff0a}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.fallback{font-size:32px;font-weight:900;letter-spacing:-2px}
h1{font-size:30px;letter-spacing:5px;margin:0;font-weight:850}
.tagline{color:var(--muted);font-size:13px;margin:8px 0 27px;letter-spacing:1.5px}
.links{display:grid;gap:13px}
.social{display:flex;align-items:center;gap:14px;padding:15px 17px;background:linear-gradient(135deg,#151515,#0d0d0d);border:1px solid var(--line);border-radius:15px;text-decoration:none;color:var(--white);transition:transform .18s,border-color .18s,background .18s;text-align:left}
.social:hover{transform:translateY(-2px);border-color:#666;background:#191919}
.icon{height:43px;width:43px;border-radius:12px;display:grid;place-items:center;flex:0 0 43px;background:#202020;border:1px solid #303030}
.icon svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.social-name{font-size:15px;font-weight:700}
.social-handle{font-size:12px;color:var(--muted);margin-top:3px}
.arrow{margin-left:auto;color:#888;font-size:22px}
footer{color:#666;font-size:11px;margin:30px 0 8px;letter-spacing:1px}
.note{font-size:11px;color:#777;margin-top:20px;line-height:1.5}
@media(prefers-reduced-motion:reduce){.social{transition:none}}
</style>
</head>
<body>
<main>
  <div class="logo-wrap" id="logoWrap">
    <img src="galib-logo.jpg" alt="GALIB GG crown logo" onerror="this.style.display='none';document.getElementById('fallback').style.display='block'">
    <div class="fallback" id="fallback" style="display:none">GG</div>
  </div>
  <h1>GALIB</h1>
  <div class="tagline">OFFICIAL SOCIAL LINKS</div>
  <nav class="links" aria-label="GALIB social media links">
    <a class="social" href="https://www.facebook.com/profile.php?id=61558782207755" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-3 0-5 2-5 5v2H6v4h3v5h4v-5h3l1-4h-4V9c0-.7.3-1 1-1z"/></svg></span>
      <span><div class="social-name">Facebook</div><div class="social-handle">Visit my profile</div></span><span class="arrow">↗</span>
    </a>
    <a class="social" href="https://www.instagram.com/galib.6529/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.6 6.5h.01"/></svg></span>
      <span><div class="social-name">Instagram</div><div class="social-handle">@galib.6529</div></span><span class="arrow">↗</span>
    </a>
    <a class="social" href="https://www.tiktok.com/@janina27782" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 4v10.5a4.5 4.5 0 1 1-4-4.47"/><path d="M14 4c.6 3.1 2.4 4.8 5.5 5"/></svg></span>
      <span><div class="social-name">TikTok</div><div class="social-handle">@janina27782</div></span><span class="arrow">↗</span>
    </a>
  </nav>
  <div class="note">One page. All my social links.</div>
  <footer>© GALIB</footer>
</main>
</body>
</html>
